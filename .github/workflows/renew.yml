name: ACLClouds Auto Renew (fixed)

on:
  schedule:
    # 每两天执行一次，北京时间早上 07:28 (UTC 23:28)
    - cron: '28 23 */1 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: aclclouds-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 按账号缓存登录会话，命中则跳过验证码求解
      - uses: actions/cache@v4
        with:
          path: |
            auth-1.json
            auth-2.json
            auth-3.json
          key: acl-session-${{ github.run_id }}
          restore-keys: |
            acl-session-

      - name: Install
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Renew
        env:
          # 双账号：沿用 kanezikii 仓库的 Secrets 命名（EMAIL/EMAIL_2）
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          EMAIL_2: ${{ secrets.EMAIL_2 }}
          PASSWORD_2: ${{ secrets.PASSWORD_2 }}
          # 兼容 bigxbossm 仓库命名（与上面二选一即可，都配则以 ACL_ 为准）
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_SERVER_ID: ${{ secrets.ACL_SERVER_ID }}
          ACL_BASE_URL: ${{ vars.ACL_BASE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node renew-fixed.mjs
