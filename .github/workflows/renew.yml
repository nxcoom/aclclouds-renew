name: ACLClouds Auto Renew

on:
  schedule:
    # 每两天执行一次，北京时间早上 0:32 (UTC 16:32, UTC 单数日触发)
    # 窗口外返回 422 renew_too_early 按 skip 处理；脚本会在窗口临近时自行等待开窗后重试
    - cron: '32 16 */2 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: aclclouds-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    # 脚本可能在窗口临近时睡等开窗 (上限 5h), 远小于 GitHub 单 job 6h 上限
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 按账号缓存登录会话，命中则跳过验证码求解
      - uses: actions/cache@v4
        with:
          path: |
            auth-1.json
            auth-2.json
            auth-3.json
          key: acl-session-${{ github.run_id }}
          restore-keys: |
            acl-session-

      # runner 偶发 DNS 故障会导致 apt 源解析失败, 从而 --with-deps 失败
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm deps
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          # 默认不走 apt: runner 镜像已自带 Chromium 运行库,
          # 且 runner 偶发 DNS 故障会让 --with-deps 卡死在 apt 源解析上
          npx playwright install chromium
          # 启动自检; 若缺系统库再回退安装依赖 (apt 可用时)
          if ! node -e "import('playwright').then(async ({chromium}) => { const b = await chromium.launch(); await b.close(); }).catch((e) => { console.error('[launch-check]', e.message); process.exit(1); })"; then
            echo "Chromium 启动自检失败，回退安装系统依赖..."
            for i in 1 2 3; do
              npx playwright install --with-deps chromium && break || sleep 15
            done
          fi

      - name: Renew
        env:
          # 双账号：沿用 kanezikii 仓库的 Secrets 命名（EMAIL/EMAIL_2）
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          EMAIL_2: ${{ secrets.EMAIL_2 }}
          PASSWORD_2: ${{ secrets.PASSWORD_2 }}
          # 兼容 bigxbossm 仓库命名（与上面二选一即可，都配则以 ACL_ 为准）
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_SERVER_ID: ${{ secrets.ACL_SERVER_ID }}
          ACL_BASE_URL: ${{ vars.ACL_BASE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node renew.mjs
